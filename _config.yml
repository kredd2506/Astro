name: ASTRA-sim · Collective Scaling
description: >
    Modeling AllReduce / AllGather scaling in ASTRA-sim across torus and switch
    topologies on the analytical and ns-3 backends — latency-bound vs
    bandwidth-bound as a function of message size and node count.
